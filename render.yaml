services:
  - type: web
    name: justpastlink-web
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements-prod.txt && cd frontend && npm ci && npm run build
    preDeployCommand: cd backend && python apply_sql_migrations.py
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: justpastlink-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: justpastlink-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: justpastlink-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: justpastlink-redis
          property: connectionString
      - key: PROCESSING_QUEUE_NAME
        value: video-processing
      - key: PROCESSING_TASK_ALWAYS_EAGER
        value: "false"
      - key: REQUIRE_FFPROBE_VALIDATION
        value: "true"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_UPLOAD_PREFIX
        value: uploads
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://justpastlink-web.onrender.com

  - type: worker
    name: justpastlink-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements-prod.txt
    startCommand: cd backend && celery -A app.tasks.celery_app.celery_app worker --loglevel=info -Q video-processing --concurrency=1
    maxShutdownDelaySeconds: 300
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: justpastlink-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: justpastlink-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: justpastlink-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: justpastlink-redis
          property: connectionString
      - key: PROCESSING_QUEUE_NAME
        value: video-processing
      - key: PROCESSING_TASK_ALWAYS_EAGER
        value: "false"
      - key: REQUIRE_FFPROBE_VALIDATION
        value: "true"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_UPLOAD_PREFIX
        value: uploads
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  - type: keyvalue
    name: justpastlink-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: justpastlink-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: justpastlink
